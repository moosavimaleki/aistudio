[unix_http_server]
file=/app/runtime/state/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/app/runtime/state/supervisord.pid
environment=DISPLAY=":99",XAUTHORITY="/home/seluser/.Xauthority"

[program:xvfb]
command=/app/supervisor/run-xvfb
priority=10
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///app/runtime/state/supervisor.sock

[program:x11vnc]
command=/app/supervisor/run-x11vnc
priority=20
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:novnc]
command=/app/supervisor/run-novnc
priority=30
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:browser-interface]
command=/app/supervisor/run-browser-interface
priority=40
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:gencontent]
command=/app/bin/gencontent
priority=50
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
