services:
  aistudio:
    image: aistudio-api:local
    build:
      context: .
      dockerfile: Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        HTTP_PROXY: "${BUILD_PROXY_URL:-http://host.docker.internal:10811}"
        HTTPS_PROXY: "${BUILD_PROXY_URL:-http://host.docker.internal:10811}"
        NO_PROXY: "localhost,127.0.0.1"
    container_name: aistudio-api
    ports:
      - "127.0.0.1:3345:3345"
      - "127.0.0.1:${GENCONTENT_HOST_PORT:-3346}:8000"
      - "127.0.0.1:${VNC_HOST_PORT:-5901}:5900"
      - "127.0.0.1:${NOVNC_HOST_PORT:-7900}:7900"
    env_file:
      - ./config/container.env
      - ./.env
    environment:
      CHATGPT_ENABLED_BROWSER_IDS: "${CHATGPT_ENABLED_BROWSER_IDS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./COOKIES:/app/cookies
      - ./CHATGPT_COOKIES:/app/chatgpt-cookies
      - browser_profiles:/app/browser-profiles
    group_add:
      - "${COOKIE_WRITER_GID:-1000}"
    shm_size: "1gb"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/supervisor/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aistudio-tab-pool-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  browser_profiles:
